server:
  port: 8080

spring:
  application:
    name: shopsmart-backend

  # ── DATABASE ──────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/shopsmart
    username: ${DB_USERNAME:shopsmart}
    password: ${DB_PASSWORD:shopsmart}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update          # Creates/updates tables automatically on startup
    show-sql: true              # Print SQL to console (very useful for debugging)
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── SPRING AI — GEMINI via OpenAI-compatible API ──────────────────────────
  # Gemini 1.5 Flash is free on AI Studio. We connect via its OpenAI-compatible URL.
  ai:
    openai:
      api-key: ${GEMINI_API_KEY:REPLACE_WITH_YOUR_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-1.5-flash

    # ── PGVECTOR — stores document embeddings for RAG ──────────────────────
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768            # Gemini text-embedding-004 output size
        initialize-schema: true    # Auto-creates the vector_store table

    # ── EMBEDDING MODEL ────────────────────────────────────────────────────
    # Separate embedding model for converting text → numbers for vector search
    embedding:
      model: text-embedding-004

  # ── FILE UPLOAD ───────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ── CORS — Allow React (port 5173) to call this backend (port 8080) ─────────
cors:
  allowed-origins: http://localhost:5173

# ── JWT SECRET ───────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:ShopSmartHCLHackathon2026SecretKeyMustBe256BitsLongForSecurity}
  expiration-ms: 86400000   # 24 hours in milliseconds

# ── LOGGING ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.shopsmart: DEBUG
    org.springframework.ai: DEBUG
