server:
  port: 8080

spring:
  application:
    name: shopsmart-server

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  # ── DATABASE CONFIGURATION ───────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:shopsmart;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ── SPRING AI (GEMINI via OpenAI-compatible endpoint) ───────────────────
  ai:
    openai:
      api-key: ${GEMINI_API_KEY:AQ.Ab8RN6LGyHWPBnK30fOUyTxtWl4-p4dvW4iAiyXdePGbHRyujA}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-3.8-flash
      embedding:
        embeddings-path: /embeddings
        options:
          model: gemini-embedding-001
          dimensions: 768

  # ── MULTIPART FILE UPLOAD (FOR POLICY DOCUMENT UPLOADS) ──────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ── CORS ───────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.shopsmart: INFO
