version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopsmart-db
    environment:
      POSTGRES_DB: shopsmart
      POSTGRES_USER: shopsmart
      POSTGRES_PASSWORD: shopsmart
    ports:
      - "5432:5432"
    volumes:
      - shopsmart_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsmart -d shopsmart"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  shopsmart_data:
